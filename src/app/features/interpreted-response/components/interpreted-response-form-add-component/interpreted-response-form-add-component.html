<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-chat-text"></i> Add New Interpreted Response
      </h2>
      <form [formGroup]="interpretedResponseForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Claim Status -->
        <div class="form-group mb-3">
          <label for="claimStatusID" class="fw-semibold mb-1">Claim Status</label>
          <app-searchable-dropdown
            [options]="claimStatuses"
            [config]="claimStatusDropdownConfig"
            [disabled]="!claimStatuses || claimStatuses.length === 0"
            [required]="true"
            (selectionChange)="onClaimStatusSelectionChange($event)"
            [ngClass]="{'is-invalid': interpretedResponseForm.get('claimStatusID')?.invalid && interpretedResponseForm.get('claimStatusID')?.touched}"
          ></app-searchable-dropdown>
          <div *ngIf="interpretedResponseForm.get('claimStatusID')?.invalid && interpretedResponseForm.get('claimStatusID')?.touched" class="invalid-feedback">
            Claim status is required.
          </div>
        </div>

        <!-- Response Keyword -->
        <div class="form-group mb-3">
          <label for="responseKeywordID" class="fw-semibold mb-1">Response Keyword</label>
          <app-searchable-dropdown
            [options]="responseKeywords"
            [config]="responseKeywordDropdownConfig"
            [disabled]="!responseKeywords || responseKeywords.length === 0"
            [required]="true"
            (selectionChange)="onResponseKeywordSelectionChange($event)"
            [ngClass]="{'is-invalid': interpretedResponseForm.get('responseKeywordID')?.invalid && interpretedResponseForm.get('responseKeywordID')?.touched}"
          ></app-searchable-dropdown>
          <div *ngIf="interpretedResponseForm.get('responseKeywordID')?.invalid && interpretedResponseForm.get('responseKeywordID')?.touched" class="invalid-feedback">
            Response keyword is required.
          </div>
        </div>

        <!-- Status -->
        <div class="form-group mb-3">
          <label for="interpretedResponseStatus" class="fw-semibold mb-1">Status</label>
          <select
            id="interpretedResponseStatus"
            class="form-control"
            formControlName="status"
            required
            [ngClass]="{'is-invalid': interpretedResponseForm.get('status')?.invalid && interpretedResponseForm.get('status')?.touched}"
          >
            <option value="">Select status...</option>
            <option value="Success">Success</option>
            <option value="Error">Error</option>
            <option value="Pending">Pending</option>
            <option value="Processing">Processing</option>
          </select>
          <div *ngIf="interpretedResponseForm.get('status')?.invalid && interpretedResponseForm.get('status')?.touched" class="invalid-feedback">
            Status is required.
          </div>
        </div>

        <!-- Interpreted Text -->
        <div class="form-group mb-3">
          <label for="interpretedResponseText" class="fw-semibold mb-1">Interpreted Text</label>
          <textarea
            id="interpretedResponseText"
            class="form-control"
            formControlName="interpretedText"
            placeholder="Enter interpreted text"
            rows="4"
            required
            [ngClass]="{'is-invalid': interpretedResponseForm.get('interpretedText')?.invalid && interpretedResponseForm.get('interpretedText')?.touched}"
          ></textarea>
          <div *ngIf="interpretedResponseForm.get('interpretedText')?.invalid && interpretedResponseForm.get('interpretedText')?.touched" class="invalid-feedback">
            Interpreted text is required.
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="interpretedResponseForm.invalid">
            <i class="bi bi-plus-circle me-2"></i>Add Interpreted Response
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
