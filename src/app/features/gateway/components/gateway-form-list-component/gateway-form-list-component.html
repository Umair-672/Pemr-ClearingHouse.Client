<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Gateways</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Gateway Type</th>
            <th>Status</th>
            <th>Deleted</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (gateway of gateways; track gateway.id) {
            <tr>
              <td>{{ $index + 1 }}</td>
              <td>{{ gateway.name }}</td>
              <td>{{ gateway.gatewayType }}</td>
              <td>
                <span class="badge" [ngClass]="gateway.isActive ? 'bg-success' : 'bg-secondary'">
                  {{ gateway.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td>
                <span class="badge" [ngClass]="gateway.isDeleted ? 'bg-danger' : 'bg-success'">
                  {{ gateway.isDeleted ? 'Deleted' : 'Not Deleted' }}
                </span>
              </td>
              <td class="text-end">
                <button
                  class="btn btn-icon btn-outline-secondary me-1"
                  title="Edit"
                  [routerLink]="['edit', gateway.id]"
                >
                  <i class="bi bi-pencil"></i>
                </button>
                <button
                  class="btn btn-icon btn-outline-danger"
                  title="Delete"
                  (click)="openDeleteDialog(gateway)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
<app-confirm-delete-dialog
  *ngIf="showDeleteModal"
  [entityName]="selectedGateway?.name ?? ''"
  title="Delete Gateway"
  (closed)="onDeleteDialogClosed($event)">
</app-confirm-delete-dialog>
