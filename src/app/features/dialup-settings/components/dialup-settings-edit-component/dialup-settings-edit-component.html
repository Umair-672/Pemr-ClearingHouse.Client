<div class="container py-4">
  <div class="row justify-content">
    <div class="col-md-8 col-lg-7">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-pencil-square"></i> Edit Dialup Setting
      </h2>
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
        *ngIf="!loading"
      >
        <div class="form-group mb-3">
          <label for="connectionName" class="fw-semibold mb-1">Connection Name</label>
          <input
            type="text"
            class="form-control"
            id="connectionName"
            formControlName="connectionName"
            placeholder="Enter Connection Name"
            [ngClass]="{'is-invalid': form.get('connectionName')?.invalid && form.get('connectionName')?.touched}"
          />
          <div
            *ngIf="form.get('connectionName')?.invalid && form.get('connectionName')?.touched"
            class="invalid-feedback"
          >
            Connection Name is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="dialingNumber" class="fw-semibold mb-1">Dialing Number</label>
          <input
            type="text"
            class="form-control"
            id="dialingNumber"
            formControlName="dialingNumber"
            placeholder="Enter Dialing Number"
            [ngClass]="{'is-invalid': form.get('dialingNumber')?.invalid && form.get('dialingNumber')?.touched}"
          />
          <div
            *ngIf="form.get('dialingNumber')?.invalid && form.get('dialingNumber')?.touched"
            class="invalid-feedback"
          >
            Dialing Number is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="userName" class="fw-semibold mb-1">User Name</label>
          <input
            type="text"
            class="form-control"
            id="userName"
            formControlName="userName"
            placeholder="Enter User Name"
            [ngClass]="{'is-invalid': form.get('userName')?.invalid && form.get('userName')?.touched}"
          />
          <div
            *ngIf="form.get('userName')?.invalid && form.get('userName')?.touched"
            class="invalid-feedback"
          >
            User Name is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="password" class="fw-semibold mb-1">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            formControlName="password"
            placeholder="Enter Password"
            [ngClass]="{'is-invalid': form.get('password')?.invalid && form.get('password')?.touched}"
          />
          <div
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
            class="invalid-feedback"
          >
            Password is required.
          </div>
        </div>
        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid"
          >
            <i class="bi bi-check-circle me-2"></i>Update Dialup Setting
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
