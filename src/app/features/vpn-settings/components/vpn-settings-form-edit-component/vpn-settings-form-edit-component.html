<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-shield-lock"></i> Edit VPN Settings
      </h2>
      <form [formGroup]="vpnSettingsForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Gateway -->
        <div class="form-group mb-3">
          <label for="gatewayID" class="fw-semibold mb-1">Gateway</label>
          <input
            id="gatewayID"
            class="form-control"
            formControlName="gatewayID"
            required
            [value]="getSelectedGatewayName()"
            [ngClass]="{'is-invalid': vpnSettingsForm.get('gatewayID')?.invalid && vpnSettingsForm.get('gatewayID')?.touched}"
          />
          <div *ngIf="vpnSettingsForm.get('gatewayID')?.invalid && vpnSettingsForm.get('gatewayID')?.touched" class="invalid-feedback">
            Gateway is required.
          </div>
        </div>

        <!-- Connection Name -->
        <div class="form-group mb-3">
          <label for="vpnSettingsConnectionName" class="fw-semibold mb-1">Connection Name</label>
          <input
            id="vpnSettingsConnectionName"
            type="text"
            class="form-control"
            formControlName="connectionName"
            placeholder="Enter connection name"
            required
            [ngClass]="{'is-invalid': vpnSettingsForm.get('connectionName')?.invalid && vpnSettingsForm.get('connectionName')?.touched}"
          />
          <div *ngIf="vpnSettingsForm.get('connectionName')?.invalid && vpnSettingsForm.get('connectionName')?.touched" class="invalid-feedback">
            Connection name is required.
          </div>
        </div>

        <!-- IP Address -->
        <div class="form-group mb-3">
          <label for="vpnSettingsIPAddress" class="fw-semibold mb-1">IP Address</label>
          <input
            id="vpnSettingsIPAddress"
            type="text"
            class="form-control"
            formControlName="ipAddress"
            placeholder="Enter IP address"
            required
            [ngClass]="{'is-invalid': vpnSettingsForm.get('ipAddress')?.invalid && vpnSettingsForm.get('ipAddress')?.touched}"
          />
          <div *ngIf="vpnSettingsForm.get('ipAddress')?.invalid && vpnSettingsForm.get('ipAddress')?.touched" class="invalid-feedback">
            IP address is required.
          </div>
        </div>

        <!-- User Name -->
        <div class="form-group mb-3">
          <label for="vpnSettingsUserName" class="fw-semibold mb-1">User Name</label>
          <input
            id="vpnSettingsUserName"
            type="text"
            class="form-control"
            formControlName="userName"
            placeholder="Enter user name"
            required
            [ngClass]="{'is-invalid': vpnSettingsForm.get('userName')?.invalid && vpnSettingsForm.get('userName')?.touched}"
          />
          <div *ngIf="vpnSettingsForm.get('userName')?.invalid && vpnSettingsForm.get('userName')?.touched" class="invalid-feedback">
            User name is required.
          </div>
        </div>

        <!-- Password -->
        <div class="form-group mb-3">
          <label for="vpnSettingsPassword" class="fw-semibold mb-1">Password</label>
          <input
            id="vpnSettingsPassword"
            type="text"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
            required
            [ngClass]="{'is-invalid': vpnSettingsForm.get('password')?.invalid && vpnSettingsForm.get('password')?.touched}"
          />
          <div *ngIf="vpnSettingsForm.get('password')?.invalid && vpnSettingsForm.get('password')?.touched" class="invalid-feedback">
            Password is required.
          </div>
        </div>

        <!-- Is Active -->
        <div class="form-check mb-3">
          <input
            id="vpnSettingsIsActive"
            type="checkbox"
            class="form-check-input"
            formControlName="isActive"
          />
          <label for="vpnSettingsIsActive" class="form-check-label fw-semibold">Active</label>
        </div>

        <!-- Is Deleted -->
        <div class="form-check mb-4">
          <input
            id="vpnSettingsIsDeleted"
            type="checkbox"
            class="form-check-input"
            formControlName="isDeleted"
          />
          <label for="vpnSettingsIsDeleted" class="form-check-label fw-semibold">Deleted</label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="vpnSettingsForm.invalid">
            <i class="bi bi-pencil-square me-2"></i>Edit VPN Settings
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
