<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-pencil"></i> Edit Subscriber
      </h2>
      <form [formGroup]="subscriberForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group mb-3">
          <label for="billingProviderID" class="fw-semibold mb-1">Billing Provider ID</label>
          <input id="billingProviderID" type="text" class="form-control" formControlName="billingProviderID" required />
        </div>
        <div class="form-group mb-3">
          <label for="firstName" class="fw-semibold mb-1">First Name</label>
          <input id="firstName" type="text" class="form-control" formControlName="firstName" required />
        </div>
        <div class="form-group mb-3">
          <label for="lastName" class="fw-semibold mb-1">Last Name</label>
          <input id="lastName" type="text" class="form-control" formControlName="lastName" required />
        </div>
        <div class="form-group mb-3">
          <label for="middleName" class="fw-semibold mb-1">Middle Name</label>
          <input id="middleName" type="text" class="form-control" formControlName="middleName" />
        </div>
        <div class="form-group mb-3">
          <label for="primaryIdentification" class="fw-semibold mb-1">Primary Identification</label>
          <input id="primaryIdentification" type="text" class="form-control" formControlName="primaryIdentification" required />
        </div>
        <div class="form-group mb-3">
          <label for="address1" class="fw-semibold mb-1">Address 1</label>
          <input id="address1" type="text" class="form-control" formControlName="address1" />
        </div>
        <div class="form-group mb-3">
          <label for="address2" class="fw-semibold mb-1">Address 2</label>
          <input id="address2" type="text" class="form-control" formControlName="address2" />
        </div>
        <div class="form-group mb-3">
          <label for="city" class="fw-semibold mb-1">City</label>
          <input id="city" type="text" class="form-control" formControlName="city" />
        </div>
        <div class="form-group mb-3">
          <label for="state" class="fw-semibold mb-1">State</label>
          <input id="state" type="text" class="form-control" formControlName="state" />
        </div>
        <div class="form-group mb-3">
          <label for="zipCode" class="fw-semibold mb-1">Zip Code</label>
          <input id="zipCode" type="text" class="form-control" formControlName="zipCode" />
        </div>
        <div class="form-group mb-3">
          <label for="secondaryIdentification" class="fw-semibold mb-1">Secondary Identification</label>
          <input id="secondaryIdentification" type="text" class="form-control" formControlName="secondaryIdentification" />
        </div>
        <div class="form-group mb-3">
          <label for="payerResponsibility" class="fw-semibold mb-1">Payer Responsibility</label>
          <input id="payerResponsibility" type="text" class="form-control" formControlName="payerResponsibility" />
        </div>
        <div class="form-group mb-3">
          <label for="relationshipCode" class="fw-semibold mb-1">Relationship Code</label>
          <input id="relationshipCode" type="text" class="form-control" formControlName="relationshipCode" />
        </div>
        <div class="form-group mb-3">
          <label for="insuranceTypeCode" class="fw-semibold mb-1">Insurance Type Code</label>
          <input id="insuranceTypeCode" type="text" class="form-control" formControlName="insuranceTypeCode" />
        </div>
        <div class="form-group mb-3">
          <label for="claimFilingIndicator" class="fw-semibold mb-1">Claim Filing Indicator</label>
          <input id="claimFilingIndicator" type="text" class="form-control" formControlName="claimFilingIndicator" />
        </div>
        <div class="form-group mb-3">
          <label for="gender" class="fw-semibold mb-1">Gender</label>
          <input id="gender" type="text" class="form-control" formControlName="gender" />
        </div>
        <div class="form-group mb-3">
          <label for="dob" class="fw-semibold mb-1">Date of Birth</label>
          <input id="dob" type="date" class="form-control" formControlName="dob" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="subscriberForm.invalid">
            <i class="bi bi-pencil-square me-2"></i>Edit Subscriber
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
