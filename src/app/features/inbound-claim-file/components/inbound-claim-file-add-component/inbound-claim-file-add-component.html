<div class="container py-4">
  <div class="row justify-content">
    <div class="col-md-8 col-lg-7">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-file-earmark-plus"></i> Add New Inbound Claim File
      </h2>
      <form [formGroup]="inboundClaimFileForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- File Name -->
        <div class="form-group mb-3">
          <label for="fileName" class="fw-semibold mb-1">File Name</label>
          <input
            id="fileName"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter file name"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('name')?.invalid && inboundClaimFileForm.get('name')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('name')?.invalid && inboundClaimFileForm.get('name')?.touched" class="invalid-feedback">
            File name is required.
          </div>
        </div>

        <!-- Received Date -->
        <div class="form-group mb-3">
          <label for="receivedDate" class="fw-semibold mb-1">Received Date</label>
          <input
            id="receivedDate"
            type="datetime-local"
            class="form-control"
            formControlName="receivedDate"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('receivedDate')?.invalid && inboundClaimFileForm.get('receivedDate')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('receivedDate')?.invalid && inboundClaimFileForm.get('receivedDate')?.touched" class="invalid-feedback">
            Received date is required.
          </div>
        </div>

        <!-- Submitter ID -->
        <div class="form-group mb-3">
          <label for="submitterID" class="fw-semibold mb-1">Submitter ID</label>
          <input
            id="submitterID"
            type="text"
            class="form-control"
            formControlName="submitterID"
            placeholder="Enter submitter ID"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('submitterID')?.invalid && inboundClaimFileForm.get('submitterID')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('submitterID')?.invalid && inboundClaimFileForm.get('submitterID')?.touched" class="invalid-feedback">
            Submitter ID is required.
          </div>
        </div>

        <!-- Receiver ID -->
        <div class="form-group mb-3">
          <label for="receiverID" class="fw-semibold mb-1">Receiver ID</label>
          <input
            id="receiverID"
            type="text"
            class="form-control"
            formControlName="receiverID"
            placeholder="Enter receiver ID"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('receiverID')?.invalid && inboundClaimFileForm.get('receiverID')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('receiverID')?.invalid && inboundClaimFileForm.get('receiverID')?.touched" class="invalid-feedback">
            Receiver ID is required.
          </div>
        </div>

        <!-- Site ID -->
        <div class="form-group mb-3">
          <label for="siteID" class="fw-semibold mb-1">Site ID</label>
          <input
            id="siteID"
            type="text"
            class="form-control"
            formControlName="siteID"
            placeholder="Enter site ID"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('siteID')?.invalid && inboundClaimFileForm.get('siteID')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('siteID')?.invalid && inboundClaimFileForm.get('siteID')?.touched" class="invalid-feedback">
            Site ID is required.
          </div>
        </div>

        <!-- Interchange Control Number -->
        <div class="form-group mb-3">
          <label for="interchangeCtrlNo" class="fw-semibold mb-1">Interchange Control Number</label>
          <input
            id="interchangeCtrlNo"
            type="text"
            class="form-control"
            formControlName="interchangeCtrlNo"
            placeholder="Enter interchange control number"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('interchangeCtrlNo')?.invalid && inboundClaimFileForm.get('interchangeCtrlNo')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('interchangeCtrlNo')?.invalid && inboundClaimFileForm.get('interchangeCtrlNo')?.touched" class="invalid-feedback">
            Interchange control number is required.
          </div>
        </div>

        <!-- Number of Claims -->
        <div class="form-group mb-3">
          <label for="noOfClaims" class="fw-semibold mb-1">Number of Claims</label>
          <input
            id="noOfClaims"
            type="number"
            class="form-control"
            formControlName="noOfClaims"
            placeholder="Enter number of claims"
            min="0"
            required
            [ngClass]="{'is-invalid': inboundClaimFileForm.get('noOfClaims')?.invalid && inboundClaimFileForm.get('noOfClaims')?.touched}"
          />
          <div *ngIf="inboundClaimFileForm.get('noOfClaims')?.invalid && inboundClaimFileForm.get('noOfClaims')?.touched" class="invalid-feedback">
            Number of claims is required and must be a valid number.
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="inboundClaimFileForm.invalid">
            <i class="bi bi-plus-circle me-2"></i>Add Inbound Claim File
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
