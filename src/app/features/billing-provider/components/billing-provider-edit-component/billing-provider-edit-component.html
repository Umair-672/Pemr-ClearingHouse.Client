<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <h2 class="mb-4 text-primary fw-bold">
        <i class="bi bi-briefcase"></i> Edit Billing Provider
      </h2>
      <form [formGroup]="billingProviderForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="form-group mb-3">
          <label for="inboundTransactionID" class="fw-semibold mb-1">Inbound Transaction ID</label>
          <input id="inboundTransactionID" type="text" class="form-control"
                 formControlName="inboundTransactionID" required
                 placeholder="Enter inbound transaction ID"
                 [ngClass]="{'is-invalid': billingProviderForm.get('inboundTransactionID')?.invalid && billingProviderForm.get('inboundTransactionID')?.touched}" />
          <div *ngIf="billingProviderForm.get('inboundTransactionID')?.invalid && billingProviderForm.get('inboundTransactionID')?.touched" class="invalid-feedback">
            Inbound Transaction ID is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="entityTypeQualifier" class="fw-semibold mb-1">Entity Type Qualifier</label>
          <input id="entityTypeQualifier" type="text" class="form-control"
                 formControlName="entityTypeQualifier" required
                 placeholder="Enter entity type qualifier"
                 [ngClass]="{'is-invalid': billingProviderForm.get('entityTypeQualifier')?.invalid && billingProviderForm.get('entityTypeQualifier')?.touched}" />
          <div *ngIf="billingProviderForm.get('entityTypeQualifier')?.invalid && billingProviderForm.get('entityTypeQualifier')?.touched" class="invalid-feedback">
            Entity Type Qualifier is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="firstName" class="fw-semibold mb-1">First Name</label>
          <input id="firstName" type="text" class="form-control"
                 formControlName="firstName" required
                 placeholder="Enter first name"
                 [ngClass]="{'is-invalid': billingProviderForm.get('firstName')?.invalid && billingProviderForm.get('firstName')?.touched}" />
          <div *ngIf="billingProviderForm.get('firstName')?.invalid && billingProviderForm.get('firstName')?.touched" class="invalid-feedback">
            First Name is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="lastName" class="fw-semibold mb-1">Last Name</label>
          <input id="lastName" type="text" class="form-control"
                 formControlName="lastName" required
                 placeholder="Enter last name"
                 [ngClass]="{'is-invalid': billingProviderForm.get('lastName')?.invalid && billingProviderForm.get('lastName')?.touched}" />
          <div *ngIf="billingProviderForm.get('lastName')?.invalid && billingProviderForm.get('lastName')?.touched" class="invalid-feedback">
            Last Name is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="middleName" class="fw-semibold mb-1">Middle Name</label>
          <input id="middleName" type="text" class="form-control"
                 formControlName="middleName"
                 placeholder="Enter middle name (optional)" />
        </div>
        <div class="form-group mb-3">
          <label for="npi" class="fw-semibold mb-1">NPI</label>
          <input id="npi" type="text" class="form-control"
                 formControlName="npi" required
                 placeholder="Enter NPI"
                 [ngClass]="{'is-invalid': billingProviderForm.get('npi')?.invalid && billingProviderForm.get('npi')?.touched}" />
          <div *ngIf="billingProviderForm.get('npi')?.invalid && billingProviderForm.get('npi')?.touched" class="invalid-feedback">
            NPI is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="address1" class="fw-semibold mb-1">Address 1</label>
          <input id="address1" type="text" class="form-control"
                 formControlName="address1" required
                 placeholder="Enter address 1"
                 [ngClass]="{'is-invalid': billingProviderForm.get('address1')?.invalid && billingProviderForm.get('address1')?.touched}" />
          <div *ngIf="billingProviderForm.get('address1')?.invalid && billingProviderForm.get('address1')?.touched" class="invalid-feedback">
            Address 1 is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="address2" class="fw-semibold mb-1">Address 2</label>
          <input id="address2" type="text" class="form-control"
                 formControlName="address2"
                 placeholder="Enter address 2 (optional)" />
        </div>
        <div class="form-group mb-3">
          <label for="city" class="fw-semibold mb-1">City</label>
          <input id="city" type="text" class="form-control"
                 formControlName="city" required
                 placeholder="Enter city"
                 [ngClass]="{'is-invalid': billingProviderForm.get('city')?.invalid && billingProviderForm.get('city')?.touched}" />
          <div *ngIf="billingProviderForm.get('city')?.invalid && billingProviderForm.get('city')?.touched" class="invalid-feedback">
            City is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="state" class="fw-semibold mb-1">State</label>
          <input id="state" type="text" class="form-control"
                 formControlName="state" required
                 placeholder="Enter state"
                 [ngClass]="{'is-invalid': billingProviderForm.get('state')?.invalid && billingProviderForm.get('state')?.touched}" />
          <div *ngIf="billingProviderForm.get('state')?.invalid && billingProviderForm.get('state')?.touched" class="invalid-feedback">
            State is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="zipCode" class="fw-semibold mb-1">Zip Code</label>
          <input id="zipCode" type="text" class="form-control"
                 formControlName="zipCode" required
                 placeholder="Enter zip code"
                 [ngClass]="{'is-invalid': billingProviderForm.get('zipCode')?.invalid && billingProviderForm.get('zipCode')?.touched}" />
          <div *ngIf="billingProviderForm.get('zipCode')?.invalid && billingProviderForm.get('zipCode')?.touched" class="invalid-feedback">
            Zip Code is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="taxonomyCode" class="fw-semibold mb-1">Taxonomy Code</label>
          <input id="taxonomyCode" type="text" class="form-control"
                 formControlName="taxonomyCode" required
                 placeholder="Enter taxonomy code"
                 [ngClass]="{'is-invalid': billingProviderForm.get('taxonomyCode')?.invalid && billingProviderForm.get('taxonomyCode')?.touched}" />
          <div *ngIf="billingProviderForm.get('taxonomyCode')?.invalid && billingProviderForm.get('taxonomyCode')?.touched" class="invalid-feedback">
            Taxonomy Code is required.
          </div>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="billingProviderForm.invalid">
          Update
        </button>
      </form>
    </div>
  </div>
</div>
