<div class="container py-4">
  <div class="row justify-content">
    <div class="col-md-8 col-lg-7">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-pencil-square"></i> Edit Outbound Claim File
      </h2>
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
        *ngIf="!loading"
      >
        <div class="form-group mb-3">
          <label for="name" class="fw-semibold mb-1">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            formControlName="name"
            placeholder="Enter Name"
            [ngClass]="{'is-invalid': form.get('name')?.invalid && form.get('name')?.touched}"
          />
          <div
            *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
            class="invalid-feedback"
          >
            Name is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="submissionDate" class="fw-semibold mb-1">Submission Date</label>
          <input
            type="date"
            class="form-control"
            id="submissionDate"
            formControlName="submissionDate"
            [ngClass]="{'is-invalid': form.get('submissionDate')?.invalid && form.get('submissionDate')?.touched}"
          />
          <div
            *ngIf="form.get('submissionDate')?.invalid && form.get('submissionDate')?.touched"
            class="invalid-feedback"
          >
            Submission Date is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="submitterID" class="fw-semibold mb-1">Submitter ID</label>
          <input
            type="text"
            class="form-control"
            id="submitterID"
            formControlName="submitterID"
            placeholder="Enter Submitter ID"
            [ngClass]="{'is-invalid': form.get('submitterID')?.invalid && form.get('submitterID')?.touched}"
          />
          <div
            *ngIf="form.get('submitterID')?.invalid && form.get('submitterID')?.touched"
            class="invalid-feedback"
          >
            Submitter ID is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="receiverID" class="fw-semibold mb-1">Receiver ID</label>
          <input
            type="text"
            class="form-control"
            id="receiverID"
            formControlName="receiverID"
            placeholder="Enter Receiver ID"
            [ngClass]="{'is-invalid': form.get('receiverID')?.invalid && form.get('receiverID')?.touched}"
          />
          <div
            *ngIf="form.get('receiverID')?.invalid && form.get('receiverID')?.touched"
            class="invalid-feedback"
          >
            Receiver ID is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="interchangeCtrlNo" class="fw-semibold mb-1">Interchange Ctrl No</label>
          <input
            type="text"
            class="form-control"
            id="interchangeCtrlNo"
            formControlName="interchangeCtrlNo"
            placeholder="Enter Interchange Ctrl No"
            [ngClass]="{'is-invalid': form.get('interchangeCtrlNo')?.invalid && form.get('interchangeCtrlNo')?.touched}"
          />
          <div
            *ngIf="form.get('interchangeCtrlNo')?.invalid && form.get('interchangeCtrlNo')?.touched"
            class="invalid-feedback"
          >
            Interchange Ctrl No is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="noOfClaims" class="fw-semibold mb-1">No Of Claims</label>
          <input
            type="number"
            class="form-control"
            id="noOfClaims"
            formControlName="noOfClaims"
            placeholder="Enter No Of Claims"
            min="1"
            [ngClass]="{'is-invalid': form.get('noOfClaims')?.invalid && form.get('noOfClaims')?.touched}"
          />
          <div
            *ngIf="form.get('noOfClaims')?.invalid && form.get('noOfClaims')?.touched"
            class="invalid-feedback"
          >
            No Of Claims is required and must be at least 1.
          </div>
        </div>
        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid"
          >
            <i class="bi bi-check-circle me-2"></i>Update Outbound Claim File
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
