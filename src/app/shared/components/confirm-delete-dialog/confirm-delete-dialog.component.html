<div class="modal fade show d-block" tabindex="-1" style="display: block; background: rgba(0,0,0,0.3);" >
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="closed.emit(false)"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong>{{ entityName }}</strong>?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="closed.emit(true)" [disabled]="loading">Yes, Delete</button>
        <button type="button" class="btn btn-secondary" (click)="closed.emit(false)">Cancel</button>
      </div>
    </div>
  </div>
</div>
