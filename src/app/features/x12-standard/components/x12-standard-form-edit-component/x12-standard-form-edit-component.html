<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-file-earmark-code"></i> Edit X12 Standard
      </h2>
      <form [formGroup]="x12StandardForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Name -->
        <div class="form-group mb-4">
          <label for="x12StandardName" class="fw-semibold mb-1">Name</label>
          <input
            id="x12StandardName"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter x12 standard name"
            required
            [ngClass]="{'is-invalid': x12StandardForm.get('name')?.invalid && x12StandardForm.get('name')?.touched}"
          />
          <div *ngIf="x12StandardForm.get('name')?.invalid && x12StandardForm.get('name')?.touched" class="invalid-feedback">
            Name is required.
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="x12StandardForm.invalid">
            <i class="bi bi-pencil-square me-2"></i>Edit X12 Standard
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
