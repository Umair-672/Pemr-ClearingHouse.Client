<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-hdd-network"></i> Add New Gateway
      </h2>
      <form [formGroup]="gatewayForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Name -->
        <div class="form-group mb-3">
          <label for="gatewayName" class="fw-semibold mb-1">Name</label>
          <input
            id="gatewayName"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter gateway name"
            required
            [ngClass]="{'is-invalid': gatewayForm.get('name')?.invalid && gatewayForm.get('name')?.touched}"
          />
          <div *ngIf="gatewayForm.get('name')?.invalid && gatewayForm.get('name')?.touched" class="invalid-feedback">
            Name is required.
          </div>
        </div>

        <!-- Gateway Type -->
        <div class="form-group mb-3">
          <label for="gatewayType" class="fw-semibold mb-1">Gateway Type</label>
          <input
            id="gatewayType"
            type="text"
            class="form-control"
            formControlName="gatewayType"
            placeholder="Enter gateway type"
            required
            [ngClass]="{'is-invalid': gatewayForm.get('gatewayType')?.invalid && gatewayForm.get('gatewayType')?.touched}"
          />
          <div *ngIf="gatewayForm.get('gatewayType')?.invalid && gatewayForm.get('gatewayType')?.touched" class="invalid-feedback">
            Gateway type is required.
          </div>
        </div>

        <!-- Is Active -->
        <div class="form-check mb-3">
          <input
            id="gatewayIsActive"
            type="checkbox"
            class="form-check-input"
            formControlName="isActive"
          />
          <label for="gatewayIsActive" class="form-check-label fw-semibold">Active</label>
        </div>

        <!-- Is Deleted -->
        <div class="form-check mb-4">
          <input
            id="gatewayIsDeleted"
            type="checkbox"
            class="form-check-input"
            formControlName="isDeleted"
          />
          <label for="gatewayIsDeleted" class="form-check-label fw-semibold">Deleted</label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="gatewayForm.invalid">
            <i class="bi bi-plus-circle me-2"></i>Add Gateway
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
