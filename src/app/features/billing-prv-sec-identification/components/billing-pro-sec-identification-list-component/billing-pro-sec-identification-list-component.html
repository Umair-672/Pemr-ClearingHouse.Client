<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Billing Pro Sec Identifications</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive tbl-dashhboard">
      <table class="table table-hover align-middle mb-0" style="table-layout: auto;">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Billing Provider</th>
            <th>Qualifier</th>
            <th>Value</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ item.billingProvider?.entityTypeQualifier }}</td>
            <td>{{ item.qualifier }}</td>
            <td>{{ item.value }}</td>
            <td class="text-end">
              <button class="btn btn-icon btn-outline-secondary me-1" title="Edit" [routerLink]="['edit', item.id]">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-icon btn-outline-danger" title="Delete" (click)="openDeleteDialog(item)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="items.length === 0">
            <td colspan="5" class="text-center py-4 text-muted">
              <i class="fas fa-inbox fa-2x mb-2"></i>
              <p class="mb-0">No Billing Pro Sec Identification found</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<app-confirm-delete-dialog
  *ngIf="showDeleteModal"
  [entityName]="selectedItem?.qualifier || 'Billing Pro Sec Identification'"
  title="Delete Billing Pro Sec Identification"
  (closed)="onDeleteDialogClosed($event)">
</app-confirm-delete-dialog>
