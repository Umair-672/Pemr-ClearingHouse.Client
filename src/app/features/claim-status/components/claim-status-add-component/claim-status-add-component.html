<div class="container py-4">
  <div class="row justify-content">
    <div class="col-md-8 col-lg-7">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-plus-circle"></i> Add New Claim Status
      </h2>
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
      >
        <div class="form-group mb-3">
          <label for="outboundClaimID" class="fw-semibold mb-1">Outbound Claim</label>
          <app-searchable-dropdown
            [options]="outboundClaims"
            [config]="outboundClaimDropdownConfig"
            [disabled]="!outboundClaims || outboundClaims.length === 0"
            [required]="true"
            (selectionChange)="onOutboundClaimSelectionChange($event)"
            [ngClass]="{'is-invalid': form.get('outboundClaimID')?.invalid && form.get('outboundClaimID')?.touched}"
          ></app-searchable-dropdown>
          <div
            *ngIf="form.get('outboundClaimID')?.invalid && form.get('outboundClaimID')?.touched"
            class="invalid-feedback"
          >
            Outbound Claim is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="status" class="fw-semibold mb-1">Status</label>
          <input
            type="text"
            class="form-control"
            id="status"
            formControlName="status"
            placeholder="Enter status"
            [ngClass]="{'is-invalid': form.get('status')?.invalid && form.get('status')?.touched}"
          />
          <div
            *ngIf="form.get('status')?.invalid && form.get('status')?.touched"
            class="invalid-feedback"
          >
            Status is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="responseText" class="fw-semibold mb-1">Response Text</label>
          <textarea
            class="form-control"
            id="responseText"
            formControlName="responseText"
            placeholder="Enter response text"
            rows="3"
            [ngClass]="{'is-invalid': form.get('responseText')?.invalid && form.get('responseText')?.touched}"
          ></textarea>
          <div
            *ngIf="form.get('responseText')?.invalid && form.get('responseText')?.touched"
            class="invalid-feedback"
          >
            Response Text is required.
          </div>
        </div>
        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid"
          >
            <i class="bi bi-plus-circle me-2"></i>Add Claim Status
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
