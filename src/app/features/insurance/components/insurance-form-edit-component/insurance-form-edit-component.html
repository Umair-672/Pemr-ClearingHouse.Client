<div class="container py-4">
  <div class="row justify-content-">
    <div class="col-md-7 col-lg-6">
      <h2 class="text mb-4 text-primary fw-bold">
        <i class="bi bi-shield-check"></i> Edit Insurance
      </h2>
      <form [formGroup]="insuranceForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Name -->
        <div class="form-group mb-3">
          <label for="insuranceName" class="fw-semibold mb-1">Name</label>
          <input
            id="insuranceName"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter insurance name"
            required
            [ngClass]="{'is-invalid': insuranceForm.get('name')?.invalid && insuranceForm.get('name')?.touched}"
          />
          <div *ngIf="insuranceForm.get('name')?.invalid && insuranceForm.get('name')?.touched" class="invalid-feedback">
            Name is required.
          </div>
        </div>

        <!-- Insurance Type -->
        <div class="form-group mb-3">
          <label for="insuranceType" class="fw-semibold mb-1">Insurance Type</label>
          <input
            id="insuranceType"
            type="text"
            class="form-control"
            formControlName="insuranceType"
            placeholder="Enter insurance type"
            required
            [ngClass]="{'is-invalid': insuranceForm.get('insuranceType')?.invalid && insuranceForm.get('insuranceType')?.touched}"
          />
          <div *ngIf="insuranceForm.get('insuranceType')?.invalid && insuranceForm.get('insuranceType')?.touched" class="invalid-feedback">
            Insurance type is required.
          </div>
        </div>

        <!-- Filing Indicator -->
        <div class="form-group mb-3">
          <label for="filingIndicator" class="fw-semibold mb-1">Filing Indicator</label>
          <input
            id="filingIndicator"
            type="text"
            class="form-control"
            formControlName="filingIndicator"
            placeholder="Enter filing indicator"
            required
            [ngClass]="{'is-invalid': insuranceForm.get('filingIndicator')?.invalid && insuranceForm.get('filingIndicator')?.touched}"
          />
          <div *ngIf="insuranceForm.get('filingIndicator')?.invalid && insuranceForm.get('filingIndicator')?.touched" class="invalid-feedback">
            Filing indicator is required.
          </div>
        </div>

        <!-- Is Active -->
        <div class="form-check mb-3">
          <input
            id="insuranceIsActive"
            type="checkbox"
            class="form-check-input"
            formControlName="isActive"
          />
          <label for="insuranceIsActive" class="form-check-label fw-semibold">Active</label>
        </div>

        <!-- Is Deleted -->
        <div class="form-check mb-4">
          <input
            id="insuranceIsDeleted"
            type="checkbox"
            class="form-check-input"
            formControlName="isDeleted"
          />
          <label for="insuranceIsDeleted" class="form-check-label fw-semibold">Deleted</label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="insuranceForm.invalid">
            <i class="bi bi-pencil-square me-2"></i>Edit Insurance
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
