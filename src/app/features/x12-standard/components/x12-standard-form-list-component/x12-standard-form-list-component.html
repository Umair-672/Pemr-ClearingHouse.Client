<h4 class="mb-3"><i class="bi bi-file-earmark-code me-2"></i>X12 Standard</h4>
<div class="card shadow-sm mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">X12 Standards</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (x12Standard of x12Standards; track x12Standard.id) {
            <tr>
              <td>{{ $index + 1 }}</td>
              <td>{{ x12Standard.name }}</td>
              <td class="text-end">
                <button
                  class="btn btn-icon btn-outline-secondary me-1"
                  title="Edit"
                  [routerLink]="['edit', x12Standard.id]"
                >
                  <i class="bi bi-pencil"></i>
                </button>
                <button
                  class="btn btn-icon btn-outline-danger"
                  title="Delete"
                  (click)="openDeleteDialog(x12Standard)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
<app-confirm-delete-dialog
  *ngIf="showDeleteModal"
  [entityName]="selectedX12Standard?.name ?? ''"
  title="Delete X12 Standard"
  (closed)="onDeleteDialogClosed($event)">
</app-confirm-delete-dialog>
